name: AviumUI 16.2 Enchilada Build
version: "1.0"

trigger:
  - push:
      branch_regex: "main"
  - pull_request:
      target_branch_regex: "main"

stages:
  build_enchilada:
    agent:
      container:
        image: ubuntu:24.04
        environment:
          - "DEBIAN_FRONTEND": "noninteractive"
          - "USER": "root"
          - "USE_CCACHE": "1"
          - "CCACHE_EXEC": "/usr/bin/ccache"
    steps:
      - run:
          name: Install Build Dependencies & Tools
          command: |
            apt-get update
            apt-get install -y \
              bc bison build-essential ccache curl flex g++-multilib \
              gcc-multilib git git-lfs gnupg gperf imagemagick \
              lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
              libssl-dev libxml2 libxml2-utils lzop pngcrush \
              rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
              python3 python-is-python3 unzip wget zstd tar ripgrep pigz jq
            git lfs install
            mkdir -p "$HOME/bin"
            curl -sLo "$HOME/bin/repo" https://storage.googleapis.com/git-repo-downloads/repo
            chmod +x "$HOME/bin/repo"
            git config --global user.name "ColoMovo CI"
            git config --global user.email "ci@colomovo.com"
            git config --global color.ui false

      - run:
          name: Initialize AviumUI Source Tree
          command: |
            export PATH="$HOME/bin:$PATH"
            echo ">>> [1/8] Initializing AviumUI 16.2 Manifest Tree (--git-lfs)..."
            repo init \
              --depth=1 \
              --no-repo-verify \
              -u https://github.com/AviumUI/android_manifests \
              -b avium-16.2 \
              -g default,-mips,-darwin,-notdefault \
              --git-lfs

      - run:
          name: Setup Enchilada Local Manifest
          command: |
            echo ">>> [2/8] Creating .repo/local_manifests/enchilada.xml..."
            mkdir -p .repo/local_manifests
            cat << 'LOCAL_MANIFEST_EOF' > .repo/local_manifests/enchilada.xml
            <?xml version="1.0" encoding="UTF-8"?>
            <manifest>

                <!-- OnePlus 6 device tree -->
                <project
                    name="LineageOS/android_device_oneplus_enchilada"
                    path="device/oneplus/enchilada"
                    remote="github"
                    revision="lineage-23.2" />

                <!-- OnePlus SDM845 common tree (Pure legacy physical A/B, no-retrofit) -->
                <project
                    name="ColoMovo-Labs/android_device_oneplus_sdm845-common"
                    path="device/oneplus/sdm845-common"
                    remote="github"
                    revision="run15-lineage-legacy-ab" />

                <!-- Kernel -->
                <project
                    name="AviumUI-Devices/kernel_oneplus_sdm845"
                    path="kernel/oneplus/sdm845"
                    remote="github"
                    revision="avium-16.2" />

                <!-- OnePlus hardware HALs -->
                <project
                    name="LineageOS/android_hardware_oneplus"
                    path="hardware/oneplus"
                    remote="github"
                    revision="lineage-23.2" />

                <!-- Dolby hardware support -->
                <project
                    name="AviumUI-Devices/hardware_dolby"
                    path="hardware/dolby"
                    remote="github"
                    revision="avium-16.2" />

                <!-- Dolby App (LunarisDolby) -->
                <project
                    name="crdroidandroid/android_packages_apps_LunarisDolby"
                    path="packages/apps/LunarisDolby"
                    remote="github"
                    revision="16.0" />

                <!-- Proprietary vendor blobs -->
                <project
                    name="TheMuppets/proprietary_vendor_oneplus_enchilada"
                    path="vendor/oneplus/enchilada"
                    remote="github"
                    revision="lineage-22.2"
                    clone-depth="1" />

                <project
                    name="ColoMovo-Labs/proprietary_vendor_oneplus_sdm845-common"
                    path="vendor/oneplus/sdm845-common"
                    remote="github"
                    revision="avium-16.2"
                    clone-depth="1" />

            </manifest>
            LOCAL_MANIFEST_EOF
            cat .repo/local_manifests/enchilada.xml

      - run:
          name: Synchronize Source Tree
          command: |
            export PATH="$HOME/bin:$PATH"
            echo ">>> [3/8] Synchronizing Repositories..."
            repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j"$(nproc --all)"

      - run:
          name: Audit No-Super and No-Retrofit Dynamic Partition Constraints
          command: |
            echo ">>> [4/8] Executing pre-build no-super / no-retrofit audit on device/oneplus..."
            
            echo "--- Checking BOARD_SUPER ---"
            grep -RIn "BOARD_SUPER" device/oneplus || true
            ACTIVE_SUPER=$(grep -RIn "BOARD_SUPER" device/oneplus | grep -vE ':[0-9]+:[[:space:]]*#' || true)
            if [ -n "$ACTIVE_SUPER" ]; then
              echo "FATAL: Found active BOARD_SUPER configuration in device/oneplus:"
              echo "$ACTIVE_SUPER"
              exit 1
            fi
            
            echo "--- Checking super_empty ---"
            grep -RIn "super_empty" device/oneplus || true
            ACTIVE_EMPTY=$(grep -RIn "super_empty" device/oneplus | grep -vE ':[0-9]+:[[:space:]]*#' || true)
            if [ -n "$ACTIVE_EMPTY" ]; then
              echo "FATAL: Found active super_empty configuration in device/oneplus:"
              echo "$ACTIVE_EMPTY"
              exit 1
            fi
            
            echo "--- Checking PRODUCT_USE_DYNAMIC_PARTITIONS ---"
            grep -RIn "PRODUCT_USE_DYNAMIC_PARTITIONS" device/oneplus || true
            ACTIVE_UDP=$(grep -RIn "PRODUCT_USE_DYNAMIC_PARTITIONS" device/oneplus | grep -vE ':[0-9]+:[[:space:]]*#' || true)
            if [ -n "$ACTIVE_UDP" ]; then
              echo "FATAL: Found active PRODUCT_USE_DYNAMIC_PARTITIONS in device/oneplus:"
              echo "$ACTIVE_UDP"
              exit 1
            fi
            
            echo "--- Checking PRODUCT_RETROFIT_DYNAMIC_PARTITIONS ---"
            grep -RIn "PRODUCT_RETROFIT_DYNAMIC_PARTITIONS" device/oneplus || true
            ACTIVE_RDP=$(grep -RIn "PRODUCT_RETROFIT_DYNAMIC_PARTITIONS" device/oneplus | grep -vE ':[0-9]+:[[:space:]]*#' || true)
            if [ -n "$ACTIVE_RDP" ]; then
              echo "FATAL: Found active PRODUCT_RETROFIT_DYNAMIC_PARTITIONS in device/oneplus:"
              echo "$ACTIVE_RDP"
              exit 1
            fi
            
            echo "PASS: Pre-build no-super and no-retrofit audit succeeded."

      - run:
          name: Setup Environment, Lunch & Verify Build Variables
          command: |
            echo ">>> [5/8] Setting up build environment and lunch target..."
            source build/envsetup.sh
            lunch lineage_enchilada-bp4a-userdebug
            
            echo "--- Verifying Critical Build Variables ---"
            TP=$(get_build_var TARGET_PRODUCT)
            echo "TARGET_PRODUCT: $TP"
            if [ "$TP" != "lineage_enchilada" ]; then
              echo "FATAL: TARGET_PRODUCT expected 'lineage_enchilada', got '$TP'"
              exit 1
            fi
            
            AB_OTA=$(get_build_var AB_OTA_PARTITIONS)
            echo "AB_OTA_PARTITIONS: $AB_OTA"
            for part in boot dtbo system vbmeta vendor LOGO abl aop bluetooth cmnlib cmnlib64 devcfg dsp fw_4j1ed fw_4u1ea hyp keymaster modem qupfw storsec tz xbl xbl_config; do
              if ! echo "$AB_OTA" | grep -qw "$part"; then
                echo "FATAL: AB_OTA_PARTITIONS missing required partition: $part"
                exit 1
              fi
            done
            
            BSPS=$(get_build_var BOARD_SUPER_PARTITION_SIZE)
            echo "BOARD_SUPER_PARTITION_SIZE: '$BSPS'"
            if [ -n "$BSPS" ]; then
              echo "FATAL: BOARD_SUPER_PARTITION_SIZE must be empty, got '$BSPS'"
              exit 1
            fi
            
            BSIS=$(get_build_var BOARD_SYSTEMIMAGE_PARTITION_SIZE)
            echo "BOARD_SYSTEMIMAGE_PARTITION_SIZE: $BSIS"
            if [ "$BSIS" != "2998927360" ]; then
              echo "FATAL: BOARD_SYSTEMIMAGE_PARTITION_SIZE expected '2998927360', got '$BSIS'"
              exit 1
            fi
            
            BVIS=$(get_build_var BOARD_VENDORIMAGE_PARTITION_SIZE)
            echo "BOARD_VENDORIMAGE_PARTITION_SIZE: $BVIS"
            if [ "$BVIS" != "1073741824" ]; then
              echo "FATAL: BOARD_VENDORIMAGE_PARTITION_SIZE expected '1073741824', got '$BVIS'"
              exit 1
            fi
            
            echo "PASS: Physical A/B partition sizes and variables strictly verified."

      - run:
          name: Verify LunarisDolby Module
          command: |
            echo ">>> [6/8] Verifying LunarisDolby presence and Android.bp module declaration..."
            if [ ! -d "packages/apps/LunarisDolby" ]; then
              echo "FATAL: packages/apps/LunarisDolby directory does not exist!"
              exit 1
            fi
            
            DOLBY_MATCH=$(grep -R 'name: "LunarisDolby"' packages/apps/LunarisDolby || true)
            if [ -z "$DOLBY_MATCH" ]; then
              echo "FATAL: name: \"LunarisDolby\" not found in packages/apps/LunarisDolby!"
              exit 1
            fi
            echo "Found: $DOLBY_MATCH"
            echo "PASS: LunarisDolby module declaration verified."

      - run:
          name: Build Stage 1 - m nothing (Dependency Graph & Soong Parse)
          command: |
            echo ">>> [7/8a] Executing build phase: m nothing..."
            source build/envsetup.sh
            lunch lineage_enchilada-bp4a-userdebug
            m nothing

      - run:
          name: Build Stage 2 - m bootimage (Kernel & Boot Verification)
          command: |
            echo ">>> [7/8b] Executing build phase: m bootimage..."
            source build/envsetup.sh
            lunch lineage_enchilada-bp4a-userdebug
            m bootimage

      - run:
          name: Build Stage 3 - m bacon (Full Target ROM)
          command: |
            echo ">>> [7/8c] Executing build phase: m bacon..."
            source build/envsetup.sh
            lunch lineage_enchilada-bp4a-userdebug
            m bacon

      - artifact:
          paths:
            - "out/target/product/enchilada/*.zip"
            - "out/target/product/enchilada/boot.img"
            - "out/target/product/enchilada/dtbo.img"
            - "out/target/product/enchilada/vbmeta.img"
