version: 2.1

jobs:
  probe:
    machine:
      image: ubuntu-2404:current
    resource_class: xlarge.gen3
    steps:
      - run:
          name: Probe CircleCI Gen3 resources
          command: |
            echo "=== CPU ==="
            nproc
            lscpu

            echo "=== MEMORY ==="
            free -h

            echo "=== DISK ==="
            df -h
            lsblk

            echo "=== SYSTEM ==="
            uname -a
            cat /etc/os-release

            echo "=== CGROUP ==="
            cat /sys/fs/cgroup/memory.max 2>/dev/null || true
            cat /sys/fs/cgroup/memory.events 2>/dev/null || true

workflows:
  probe:
    jobs:
      - probe
