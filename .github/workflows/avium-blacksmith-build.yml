name: AviumUI Blacksmith Clean Reproduction & Full Bacon

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: avium-blacksmith-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 720

    steps:
      - name: System & Disk Pre-Flight Check
        run: |
          echo "=================================================="
          echo "=== 1. BLACKSMITH HARDWARE & NVMe PRE-FLIGHT ==="
          echo "=================================================="
          echo "=== CPU INFO ==="
          nproc
          lscpu | head -n 25

          echo "=== MEMORY ==="
          free -h

          echo "=== NVMe DISK ==="
          df -hT
          lsblk

      - name: Install Build Dependencies & Tools
        run: |
          echo "=================================================="
          echo "=== 2. INSTALLING BUILD DEPENDENCIES ==="
          echo "=================================================="
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 unzip wget zstd tar ripgrep pigz jq

          git lfs install
          mkdir -p "$HOME/bin"
          curl -sLo "$HOME/bin/repo" https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Checkout AviumUI Repository (Metadata & Workflows)
        uses: actions/checkout@v4
        with:
          path: avium-metadata

      - name: Setup Disk-First Directories on NVMe
        run: |
          echo "=================================================="
          echo "=== 3. SETUP DISK-FIRST NVMe DIRECTORIES ==="
          echo "=================================================="
          # Create workspace on root NVMe filesystem (avoiding tmpfs RAM limit)
          sudo mkdir -p /mnt/android/avium /mnt/android/ccache /mnt/android/tmp /mnt/android/release_artifacts
          sudo chown -R runner:docker /mnt/android
          df -hT /mnt/android

      - name: Initialize Repo with Pinned Manifest
        run: |
          echo "=================================================="
          echo "=== 4. INITIALIZING REPO WITH PINNED MANIFEST ==="
          echo "=================================================="
          export PATH="$HOME/bin:$PATH"
          cd /mnt/android/avium

          git config --global user.name "ColoMovo"
          git config --global user.email "colomovo@users.noreply.github.com"
          git config --global color.ui false

          META_DIR="${GITHUB_WORKSPACE:-/home/runner/_work/aviumui-enchilada/aviumui-enchilada}/avium-metadata"
          [ ! -d "$META_DIR" ] && META_DIR=$(find /home/runner -maxdepth 4 -type d -name "avium-metadata" 2>/dev/null | head -n 1)
          echo "Using META_DIR: $META_DIR"

          repo init -u https://github.com/ColoMovo-Labs/aviumui-enchilada-manifests.git -b main \
            -m build1-pinned-manifest.xml \
            --depth=1 --git-lfs --no-clone-bundle

          # Note: build1-pinned-manifest.xml already includes all enchilada projects pinned to exact commit revisions.

          echo "=== Verified Pinned Manifest Hash ==="
          sha256sum .repo/manifest.xml

      - name: Synchronize Source Repositories (-j16)
        run: |
          echo "=================================================="
          echo "=== 5. SYNCING ANDROID SOURCE TREE ==="
          echo "=================================================="
          export PATH="$HOME/bin:$PATH"
          cd /mnt/android/avium

          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --force-sync -j16 || \
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --force-sync -j4

          echo "=== Storage after source sync ==="
          df -hT /mnt/android

      - name: Verify SELinux Fix History & State
        run: |
          echo "=================================================="
          echo "=== 5b. VERIFYING SELINUX FIX HISTORY & STATE ==="
          echo "=================================================="
          COMMON_DIR="/mnt/android/avium/device/oneplus/sdm845-common"
          cd "$COMMON_DIR"

          echo "=== Git Log (Last 10 commits) ==="
          git log --oneline -n 10

          echo "=== Checking commit f735121 ==="
          if git log --oneline | grep -q "f735121"; then
            echo "PASS: f735121 (XDSP fix) is present in history."
          else
            echo "WARNING: f735121 not found in local log; checking tree state..."
          fi

          echo "=== Checking for forbidden vendor_xdsp_device ==="
          if grep -rn "vendor_xdsp_device" sepolicy/; then
            echo "ERROR: Forbidden vendor_xdsp_device found in sepolicy!"
            exit 1
          fi
          echo "PASS: Zero occurrences of vendor_xdsp_device."

          echo "=== Verifying legitimate xdsp_device ==="
          grep -rn "xdsp_device" sepolicy/

      - name: Apply Established Patches & Blocker Resolutions
        run: |
          echo "=================================================="
          echo "=== 6. APPLYING PATCHES & RESOLVING 4 BLOCKERS ==="
          echo "=================================================="
          META_DIR="${GITHUB_WORKSPACE:-/home/runner/_work/aviumui-enchilada/aviumui-enchilada}/avium-metadata"
          [ ! -d "$META_DIR" ] && META_DIR=$(find /home/runner -maxdepth 4 -type d -name "avium-metadata" 2>/dev/null | head -n 1)
          echo "Using META_DIR: $META_DIR"
          cd /mnt/android/avium

          if [ -f "$META_DIR/scripts/fix_known_blockers.sh" ]; then
            bash "$META_DIR/scripts/fix_known_blockers.sh" /mnt/android/avium "$META_DIR"
          fi

      - name: Configure NVMe Ccache (50GB)
        run: |
          echo "=================================================="
          echo "=== 7. CONFIGURING NVMe CCACHE (50GB) ==="
          echo "=================================================="
          export CCACHE_DIR=/mnt/android/ccache
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 50G
          ccache -z
          ccache -s

      - name: "SELinux Preflight (vendor_sepolicy, recovery_sepolicy, neverallows)"
        run: |
          set -eo pipefail
          echo "=================================================="
          echo "=== 8. SELINUX PREFLIGHT VERIFICATION ==="
          echo "=================================================="
          export PATH="$HOME/bin:$PATH"
          unset OUT_DIR
          export TMPDIR=/mnt/android/tmp
          export CCACHE_DIR=/mnt/android/ccache
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          cd /mnt/android/avium
          source build/envsetup.sh
          breakfast enchilada

          echo "=== Compiling SELinux policy targets ==="
          m -j16 vendor_sepolicy.cil.raw recovery_sepolicy.cil sepolicy_neverallows 2>&1 | tee /mnt/android/sepolicy_preflight.log

          echo "=== Checking SELinux preflight output ==="
          if grep -iE "unknown type|undefined type|neverallow violation|checkpolicy: error" /mnt/android/sepolicy_preflight.log; then
            echo "ERROR: SELinux preflight encountered violations!"
            exit 1
          fi
          echo "PASS: SELinux preflight 100% clean."

      - name: "Phase 1: Test Compile Single Blocker Modules"
        run: |
          set -eo pipefail
          echo "=================================================="
          echo "=== 9. SINGLE-MODULE VERIFICATION ==="
          echo "=================================================="
          export PATH="$HOME/bin:$PATH"
          unset OUT_DIR
          export TMPDIR=/mnt/android/tmp
          export CCACHE_DIR=/mnt/android/ccache
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          cd /mnt/android/avium
          source build/envsetup.sh
          breakfast enchilada

          echo "=== Verifying B01: libgralloccore ==="
          m -j16 libgralloccore

          echo "=== Verifying B02: libqti-perfd ==="
          m -j16 libqti-perfd

          echo "=== Verifying B03: libqti-iopd & libqti-iopd-client ==="
          m -j16 libqti-iopd libqti-iopd-client

          echo "=== Verifying B04: libwfdservice ==="
          m -j16 libwfdservice

          echo "=== Single-module checks complete. All 4 blockers PASS! Ready for Full Bacon. ==="

      - name: "Phase 2: Full Bacon Build (-j16, kernel -j8, -k 0)"
        run: |
          set -eo pipefail
          echo "=================================================="
          echo "=== 10. FULL BACON BUILD (-j16, kernel -j8, -k 0) ==="
          echo "=================================================="
          export PATH="$HOME/bin:$PATH"
          unset OUT_DIR
          export TMPDIR=/mnt/android/tmp
          export CCACHE_DIR=/mnt/android/ccache
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          cd /mnt/android/avium
          source build/envsetup.sh
          breakfast enchilada

          set +e
          # Kernel sub-build fixed to -j8; AOSP -j16; keep-going -k 0
          m -k 0 -j16 TARGET_KERNEL_ADDITIONAL_FLAGS="-j8" bacon 2>&1 | tee /mnt/android/bacon_build.log
          BACON_STATUS=${PIPESTATUS[0]}
          set -e
          echo "BACON_STATUS=$BACON_STATUS" >> "$GITHUB_ENV"
          echo "Bacon build finished with exit code: $BACON_STATUS"

      - name: Artifact Preservation & Reporting
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=================================================="
          echo "=== 11. ARTIFACT PRESERVATION & VERIFICATION ==="
          echo "=================================================="
          REL_DIR="/mnt/android/release_artifacts"
          OUT_ENCHILADA="/mnt/android/avium/out/target/product/enchilada"
          mkdir -p "$REL_DIR"

          # 1. Collect Logs
          echo "=== Collecting Build Logs ==="
          if [ -f "/mnt/android/bacon_build.log" ]; then
            pigz -c "/mnt/android/bacon_build.log" > "$REL_DIR/bacon_build.log.gz" || true
          fi
          if [ -f "/mnt/android/sepolicy_preflight.log" ]; then
            pigz -c "/mnt/android/sepolicy_preflight.log" > "$REL_DIR/sepolicy_preflight.log.gz" || true
          fi
          if [ -f "/mnt/android/avium/out/soong.log" ]; then
            pigz -c "/mnt/android/avium/out/soong.log" > "$REL_DIR/soong.log.gz" || true
          fi
          if [ -f "/mnt/android/avium/out/.ninja_log" ]; then
            pigz -c "/mnt/android/avium/out/.ninja_log" > "$REL_DIR/ninja_build.log.gz" || true
          fi

          # 1b. Collect Run #14 Reproducibility Manifest & State
          echo "=== Collecting Run #14 Reproducibility Manifests ==="
          META_DIR="${GITHUB_WORKSPACE:-/home/runner/_work/aviumui-enchilada/aviumui-enchilada}/avium-metadata"
          [ ! -d "$META_DIR" ] && META_DIR=$(find /home/runner -maxdepth 4 -type d -name "avium-metadata" 2>/dev/null | head -n 1)
          if [ -d "$META_DIR/manifests" ]; then
            cp -f "$META_DIR"/manifests/run14-* "$REL_DIR/" 2>/dev/null || true
          fi
          if [ -d "/mnt/android/avium/.repo" ]; then
            cd /mnt/android/avium
            repo manifest -r > "$REL_DIR/run14-pinned-manifest.xml" || true
            sha256sum "$REL_DIR/run14-pinned-manifest.xml" > "$REL_DIR/run14-pinned-manifest.xml.sha256" || true
          fi

          # 1c. Archive Ccache
          echo "=== Archiving Ccache for Future Runs ==="
          if [ -d "/mnt/android/ccache" ] && [ "$(ls -A /mnt/android/ccache 2>/dev/null)" ]; then
            tar -I pigz -cf "$REL_DIR/ccache.tar.gz" -C /mnt/android ccache || true
          fi

          # 2. Collect Images & ROM
          if [ -d "$OUT_ENCHILADA" ]; then
            cd "$OUT_ENCHILADA"
            echo "=== Preserving Partition Images ==="
            for img in boot.img dtbo.img vendor_boot.img recovery.img vbmeta.img vbmeta_system.img android-info.txt; do
              if [ -f "$img" ]; then
                cp -f "$img" "$REL_DIR/"
                sha256sum "$img" > "$REL_DIR/$img.sha256"
              fi
            done

            ZIP_FILE=$(ls -1 AviumUI-*.zip 2>/dev/null | head -n 1 || true)
            if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
              echo "SUCCESS: FINAL ROM ZIP PRODUCED: $ZIP_FILE"
              sync
              sleep 2
              sha256sum "$ZIP_FILE" > "$ZIP_FILE.sha256"
              cp -f "$ZIP_FILE" "$REL_DIR/"
              cp -f "$ZIP_FILE.sha256" "$REL_DIR/"
              
              # Verify copied file
              cd "$REL_DIR"
              sha256sum -c "$ZIP_FILE.sha256"
              echo "=== Copied ROM ZIP verified match ==="
            else
              echo "STATUS: Intermediate / Blocker state (no final ZIP produced yet)"
            fi
          fi

          echo "=== Release Artifacts Summary ==="
          ls -lh "$REL_DIR"

          echo "=== Ccache Statistics ==="
          ccache -s

          # 3. Create GitHub Release if ROM ZIP exists
          if [ -n "${ZIP_FILE:-}" ] && [ -f "$REL_DIR/$ZIP_FILE" ]; then
            echo "Creating GitHub Release for completed ROM..."
            RELEASE_TAG="avium-16.2.1-enchilada-build-${{ github.run_id }}"
            gh release create "$RELEASE_TAG" "$REL_DIR"/* \
              --title "AviumUI 16.2.1 enchilada - Build ${{ github.run_id }}" \
              --notes "Official clean build from Blacksmith runner. Includes ROM zip, boot images, and logs." || true
          fi

      - name: Upload Build Artifacts & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blacksmith-build-${{ github.run_id }}-artifacts
          path: |
            /mnt/android/release_artifacts/*
          if-no-files-found: warn

      - name: Final Bacon CI Status Gate
        run: |
          echo "=================================================="
          echo "=== 12. FINAL STATUS GATE ==="
          echo "=================================================="
          echo "BACON_STATUS is: ${BACON_STATUS:-undefined}"
          if [ "${BACON_STATUS:-1}" -ne 0 ]; then
            echo "ERROR: Bacon build failed with exit code ${BACON_STATUS:-1}!"
            exit "${BACON_STATUS:-1}"
          fi
          echo "SUCCESS: Bacon build succeeded with exit code 0."
