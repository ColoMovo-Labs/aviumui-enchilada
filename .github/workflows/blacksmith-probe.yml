name: Blacksmith Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Probe runner
        run: |
          echo "=== CPU ==="
          nproc
          lscpu | head -30

          echo "=== MEMORY ==="
          free -h

          echo "=== DISK ==="
          df -hT
          lsblk

          echo "=== SYSTEM ==="
          uname -a
