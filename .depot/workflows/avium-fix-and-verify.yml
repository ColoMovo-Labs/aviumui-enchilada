name: AviumUI Fix and Verify Camera Perf and Legacy Sepolicy

on:
  workflow_dispatch:

concurrency:
  group: avium-enchilada-persistent-workspace
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: depot-ubuntu-24.04-16

    steps:
      - name: Mount persistent Android workspace
        uses: depot/cache-mount@v1
        with:
          name: aviumui-aosp-workspace
          path: /mnt/avium-cache

      - name: Prepare build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 unzip wget zstd tar ripgrep

          git lfs install
          mkdir -p "$HOME/bin" "$HOME/.depot/bin"
          curl -o "$HOME/bin/repo" \
            https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x "$HOME/bin/repo"

          curl -L https://depot.dev/install-cli.sh | sh
          echo "$HOME/bin:$HOME/.depot/bin" >> "$GITHUB_PATH"

      - name: Execute Fix, Commit, and Incremental Verification
        shell: bash
        run: |
          set -eo pipefail

          export PATH="$HOME/bin:$HOME/.depot/bin:$PATH"
          export DEPOT_TOKEN="depot_9649caba5f1fafb0b61772b6f80a9931aedcc331f1b1ee963ae17c6c51148686"

          STATUS_DIR="/mnt/avium-cache/status"
          LOG_DIR="/mnt/avium-cache/build-logs"
          RELEASE_DIR="/mnt/avium-cache/releases/build1"
          RELEASE_BOOT_DIR="$RELEASE_DIR/bootimage"
          FAILURE_DIR="/mnt/avium-cache/build-failures"
          CHECKPOINT_DIR="/mnt/avium-cache/checkpoints/out"
          SOURCE_BACKUP_DIR="/mnt/avium-cache/checkpoints/build1-source-state"

          mkdir -p "$STATUS_DIR" "$LOG_DIR" "$RELEASE_DIR" "$RELEASE_BOOT_DIR" "$FAILURE_DIR" "$CHECKPOINT_DIR" "$SOURCE_BACKUP_DIR"

          SOURCE_ROOT="/mnt/avium-cache/android/avium"
          TARGET_REPO="$SOURCE_ROOT/device/oneplus/sdm845-common"
          cd "$TARGET_REPO"

          echo "=================================================="
          echo "=== STEP 1: PRE-MODIFICATION AUDIT & LOG RECORD ==="
          echo "=================================================="
          git config user.name "ColoMovo"
          git config user.email "lolojicoco@outlook.com"
          git status
          git diff
          echo "--- RECENT COMMITS ---"
          git log -n 3 --oneline

          echo "=================================================="
          echo "=== STEP 2: APPLY CAMERA PERF FIX ==="
          echo "=================================================="
          # hal_cameraHIDL_default.te
          # 1. vendor_hal_perf_default -> hal_perf_default
          # 2. vendor_hal_perf_hwservice -> hal_perf_hwservice
          sed -i 's/vendor_hal_perf_default/hal_perf_default/g' sepolicy/vendor/hal_cameraHIDL_default.te
          sed -i 's/vendor_hal_perf_hwservice/hal_perf_hwservice/g' sepolicy/vendor/hal_cameraHIDL_default.te

          echo "=================================================="
          echo "=== STEP 3: VERIFY CAMERA PERF FIX ==="
          echo "=================================================="
          git diff --check sepolicy/vendor/hal_cameraHIDL_default.te
          git diff sepolicy/vendor/hal_cameraHIDL_default.te
          rg -n 'vendor_hal_perf_(default|hwservice)' sepolicy/vendor/hal_cameraHIDL_default.te || echo "CLEAN: No invalid perf prefixes in hal_cameraHIDL_default.te!"

          echo "=================================================="
          echo "=== STEP 4: GIT COMMIT CAMERA PERF FIX ==="
          echo "=================================================="
          git add sepolicy/vendor/hal_cameraHIDL_default.te
          git commit -m "sdm845-common: sepolicy: fix camera perf types"
          CAMERA_COMMIT_SHA=$(git rev-parse HEAD)
          echo "COMMIT_CAMERA_SHA: $CAMERA_COMMIT_SHA"
          git show --stat -p "$CAMERA_COMMIT_SHA"

          echo "=================================================="
          echo "=== STEP 5: APPLY ADDITIONAL CONFIRMED CLASS A FIXES ==="
          echo "=================================================="
          # hal_fingerprint_device.te
          sed -i 's/vendor_hal_perf_default/hal_perf_default/g' sepolicy/vendor/hal_fingerprint_device.te
          sed -i 's/vendor_hal_perf_hwservice/hal_perf_hwservice/g' sepolicy/vendor/hal_fingerprint_device.te

          # hal_ifaa_default.te
          sed -i 's/vendor_hal_perf_default/hal_perf_default/g' sepolicy/vendor/hal_ifaa_default.te
          sed -i 's/vendor_hal_perf_hwservice/hal_perf_hwservice/g' sepolicy/vendor/hal_ifaa_default.te

          # file_contexts: custom_ab_block_device
          sed -i 's/vendor_custom_ab_block_device/custom_ab_block_device/g' sepolicy/vendor/file_contexts

          echo "=================================================="
          echo "=== STEP 6: VERIFY CLASS A FIXES ==="
          echo "=================================================="
          git diff --check
          git diff
          rg -n 'vendor_hal_perf_(default|hwservice)|vendor_custom_ab_block_device' sepolicy/vendor/ || echo "CLEAN: No invalid perf or custom_ab prefixes remain!"

          echo "=================================================="
          echo "=== STEP 7: GIT COMMIT CLASS A ALIGNMENT ==="
          echo "=================================================="
          git add sepolicy/vendor/hal_fingerprint_device.te sepolicy/vendor/hal_ifaa_default.te sepolicy/vendor/file_contexts
          git commit -m "sdm845-common: sepolicy: align legacy QCOM type names"
          ALIGN_COMMIT_SHA=$(git rev-parse HEAD)
          echo "COMMIT_ALIGN_SHA: $ALIGN_COMMIT_SHA"
          git show --stat -p "$ALIGN_COMMIT_SHA"

          echo "=================================================="
          echo "=== STEP 8: RESTORE LATEST OUT CHECKPOINT ==="
          echo "=================================================="
          cd "$SOURCE_ROOT"

          export OUT_DIR=/tmp/avium-out
          export TMPDIR=/tmp/avium-tmp
          export CCACHE_DIR=/tmp/avium-ccache
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          mkdir -p "$OUT_DIR" "$TMPDIR" "$CCACHE_DIR"

          if [ -f "$CHECKPOINT_DIR/latest.tar.zst" ] && [ -f "$CHECKPOINT_DIR/latest.metadata" ]; then
            echo "Found valid checkpoint archive: $CHECKPOINT_DIR/latest.tar.zst"
            cat "$CHECKPOINT_DIR/latest.metadata"
            echo "Extracting checkpoint to $OUT_DIR..."
            tar --zstd -xf "$CHECKPOINT_DIR/latest.tar.zst" -C "$OUT_DIR"
            echo "Checkpoint extracted. Size: $(du -sh "$OUT_DIR" | cut -f1)"
          else
            echo "No prior latest.tar.zst found in $CHECKPOINT_DIR."
          fi

          echo "=================================================="
          echo "=== STEP 9: SETUP BUILD ENVIRONMENT ==="
          echo "=================================================="
          source build/envsetup.sh
          lunch lineage_enchilada-bp4a-userdebug

          echo "=================================================="
          echo "=== STEP 10: MINIMAL RECOVERY SEPOLICY VALIDATION ==="
          echo "=================================================="
          cil_log="$LOG_DIR/build1-recovery-sepolicy-cil-$(date -u +%Y%m%dT%H%M%SZ).log"
          set +e
          m -j8 recovery_sepolicy.cil 2>&1 | tee "$cil_log"
          cil_status=${PIPESTATUS[0]}
          set -e

          if [ "$cil_status" -ne 0 ]; then
            echo "ERROR: recovery_sepolicy.cil build failed with exit status $cil_status"
            tail -n 100 "$cil_log"
            exit "$cil_status"
          fi
          echo "FIX_VERIFIED: recovery_sepolicy.cil checkpolicy passed with exit status 0!"

          echo "=================================================="
          echo "=== STEP 11: BUILD BOOTIMAGE TARGET ==="
          echo "=================================================="
          boot_img_target="$OUT_DIR/target/product/enchilada/boot.img"
          boot_log="$LOG_DIR/build1-bootimage-verify-$(date -u +%Y%m%dT%H%M%SZ).log"
          set +e
          m -j8 bootimage 2>&1 | tee "$boot_log"
          boot_status=${PIPESTATUS[0]}
          set -e

          if [ "$boot_status" -ne 0 ] || [ ! -f "$boot_img_target" ]; then
            echo "ERROR: Bootimage build failed with status $boot_status"
            tail -n 100 "$boot_log"
            exit "$boot_status"
          fi

          boot_size=$(stat -c %s "$boot_img_target")
          boot_sha256=$(sha256sum "$boot_img_target" | cut -d' ' -f1)
          echo "Boot.img validated: $boot_img_target ($boot_size bytes, SHA256: $boot_sha256)"
          cp "$boot_img_target" "$RELEASE_BOOT_DIR/boot.img" || true
          echo "$boot_sha256  boot.img" > "$RELEASE_BOOT_DIR/SHA256SUMS.txt" || true
          echo "BOOTIMAGE_BUILD_PASS=YES"

          echo "=================================================="
          echo "=== STEP 12: INCREMENTAL M BACON ==="
          echo "=================================================="
          bacon_log="$LOG_DIR/build1-bacon-verify-$(date -u +%Y%m%dT%H%M%SZ).log"
          set +e
          m -j8 bacon 2>&1 | tee "$bacon_log"
          bacon_status=${PIPESTATUS[0]}
          set -e

          if [ "$bacon_status" -ne 0 ]; then
            echo "ERROR: m bacon failed with exit code $bacon_status"
            fail_snap="$FAILURE_DIR/bacon-verify-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p "$fail_snap"
            tail -n 300 "$bacon_log" > "$fail_snap/error_tail.txt" || true
            exit "$bacon_status"
          fi

          echo "FULL_ROM_BUILD_PASS=YES"
