name: AviumUI GWP ASan force checkout recovery

on:
  workflow_dispatch:

concurrency:
  group: avium-enchilada-persistent-workspace
  cancel-in-progress: false

jobs:
  recover-gwp-asan:
    runs-on: depot-ubuntu-24.04-16

    steps:
      - name: Mount persistent Android workspace
        uses: depot/cache-mount@v1
        with:
          name: aviumui-aosp-workspace
          path: /mnt/avium-cache

      - name: Prepare repo tool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git curl python-is-python3
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/repo" \
            https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Verify interrupted GWP ASan checkout and remove its one stale lock
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:$PATH"
          source_root=/mnt/avium-cache/android/avium
          project=external/gwp_asan
          worktree="$source_root/$project"
          expected_gitdir="$source_root/.repo/projects/external/gwp_asan.git"
          lock_path="$expected_gitdir/index.lock"
          expected_lock_mtime='2026-08-30 00:04:04.207331854 +0000'
          expected_index_license=$'120000 2acbe451321e78eec027e60277e1d100aa76f8e6 0\tLICENSE'
          expected_worktree_license=5a79a1b9d5cb0af9a779751f07033e44ca3b14d8

          test -d "$source_root/.repo"
          test -d "$worktree"
          persistent_writers=0
          process_rows="$(pgrep -af 'repo|git' || true)"
          if test -z "$process_rows"; then
            echo 'No repo/git processes found.'
          else
            while IFS= read -r row; do
              pid=${row%% *}
              cwd=$(readlink "/proc/$pid/cwd" 2>/dev/null || printf UNKNOWN)
              case "$cwd" in
                "$source_root"|"$source_root"/*) scope=PERSISTENT_SOURCE_TREE; persistent_writers=1 ;;
                *) scope=UNRELATED_TO_PERSISTENT_SOURCE_TREE ;;
              esac
              printf 'PID=%s scope=%s cwd=%s cmd=%s\n' "$pid" "$scope" "$cwd" "$row"
            done <<< "$process_rows"
          fi
          test "$persistent_writers" -eq 0

          gitdir=$(git -C "$worktree" rev-parse --absolute-git-dir)
          printf 'gitdir=%s\n' "$gitdir"
          test "$gitdir" = "$expected_gitdir"
          git -C "$worktree" rev-parse HEAD
          test "$(git -C "$worktree" remote get-url aosp)" = \
            https://android.googlesource.com/platform/external/gwp_asan

          status=$(git -C "$worktree" status --porcelain=v1 -uno)
          printf 'status=%s\n' "$status"
          test "$status" = ' M LICENSE'
          index_license=$(git -C "$worktree" ls-files -s -- LICENSE)
          worktree_license=$(git -C "$worktree" hash-object LICENSE)
          printf 'index_LICENSE=%s\nworktree_LICENSE=%s\n' \
            "$index_license" "$worktree_license"
          test "$index_license" = "$expected_index_license"
          test "$worktree_license" = "$expected_worktree_license"
          test ! -L "$worktree/LICENSE"
          test "$(stat -c '%a' "$worktree/LICENSE")" = 644

          cd "$source_root"
          sync_help="$(repo sync -h)"
          printf '%s\n' "$sync_help" | grep -F -A1 -- '--force-checkout'
          printf '%s\n' "$sync_help" | grep -Fq -- '--force-checkout'
          printf '%s\n' "$sync_help" | grep -Fq -- '--fail-fast'
          echo 'SUPPORTED: --force-checkout'
          echo 'SUPPORTED: --fail-fast'

          test -f "$lock_path"
          test ! -L "$lock_path"
          test "$(stat -c '%s' "$lock_path")" = 0
          lock_mtime=$(stat -c '%y' "$lock_path")
          printf 'lock size=0 mtime=%s\n' "$lock_mtime"
          test "$lock_mtime" = "$expected_lock_mtime"
          rm -- "$lock_path"
          test ! -e "$lock_path"
          echo "STALE_LOCK_REMOVED=$lock_path"

      - name: Force checkout only GWP ASan
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:$PATH"
          cd /mnt/avium-cache/android/avium
          repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j1 \
            --fail-fast \
            --force-checkout \
            external/gwp_asan

      - name: Continue the six-project serial targeted sync
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:$PATH"
          cd /mnt/avium-cache/android/avium
          repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j1 \
            --fail-fast \
            external/google-cloud-java \
            external/guava \
            external/guice \
            external/gwp_asan \
            prebuilts/clang/host/linux-x86 \
            prebuilts/rust
